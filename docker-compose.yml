services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankops
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankops}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankops -d bankops"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ., dockerfile: Dockerfile.backend}
    environment:
      DATABASE_URL: postgresql+psycopg://bankops:${POSTGRES_PASSWORD:-bankops}@postgres:5432/bankops
      OTEL_SERVICE_NAME: banking-agent-observability-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  ui:
    build: {context: ., dockerfile: Dockerfile.frontend}
    environment: {API_BASE_URL: http://api:8000}
    ports: ["8501:8501"]
    depends_on: [api]
  seed:
    build: {context: ., dockerfile: Dockerfile.backend}
    command: ["python", "-m", "backend.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://bankops:${POSTGRES_PASSWORD:-bankops}@postgres:5432/bankops
    depends_on: {api: {condition: service_healthy}}
    profiles: ["seed"]
volumes: {pgdata: {}}
